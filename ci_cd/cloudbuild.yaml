# ===========================================================================
# 5.3 Estrategia de Git & CI/CD: 
# cloudbuild.yaml
# Pipeline CI/CD para el pipeline de datos de TG Corp
#
# Etapas:
#   1. Lint & Format (ruff, black)
#   2. Tests unitarios con cobertura
#   3. Tests de integración (si no es feature branch)
#   4. Build & push imagen Docker
#   5. Deploy a Dev / Staging / Prod según la rama
#   6. Migraciones de esquema BigQuery
#   7. Notificación de resultado
# ===========================================================================

steps:

  # =========================================================================
  # ETAPA 1: Lint y formato del código Python
  # =========================================================================
  - name: "python:3.12-slim"
    id: "lint"
    entrypoint: bash
    args:
      - -c
      - |
        pip install --quiet ruff black isort
        echo "→ Verificando formato con black..."
        black --check --diff .
        echo "→ Verificando imports con isort..."
        isort --check-only --diff .
        echo "→ Analizando código con ruff..."
        ruff check . --output-format=github
        echo "✓ Lint completado sin errores."

  # =========================================================================
  # ETAPA 2: Tests unitarios con cobertura mínima del 80%
  # =========================================================================
  - name: "python:3.12-slim"
    id: "unit-tests"
    waitFor: ["lint"]
    entrypoint: bash
    args:
      - -c
      - |
        pip install --quiet -r requirements.txt pytest pytest-cov pytest-mock
        echo "→ Ejecutando tests unitarios..."
        pytest tests/unit/ \
          --cov=. \
          --cov-report=term-missing \
          --cov-fail-under=80 \
          --junit-xml=/workspace/test-results/unit.xml \
          -v
        echo "✓ Tests unitarios completados."
    env:
      - "PYTHONDONTWRITEBYTECODE=1"

  # =========================================================================
  # ETAPA 3: Tests de integración (solo en develop, release, main)
  # =========================================================================
  - name: "python:3.12-slim"
    id: "integration-tests"
    waitFor: ["unit-tests"]
    entrypoint: bash
    args:
      - -c
      - |
        # Saltar en feature branches para acelerar el feedback
        BRANCH="${BRANCH_NAME}"
        if [[ "$BRANCH" == feature/* ]]; then
          echo "→ Feature branch detectada. Saltando tests de integración."
          exit 0
        fi
        pip install --quiet -r requirements.txt pytest pytest-mock
        echo "→ Ejecutando tests de integración contra entorno Dev..."
        pytest tests/integration/ \
          --junit-xml=/workspace/test-results/integration.xml \
          -v
        echo "✓ Tests de integración completados."
    secretEnv:
      - "BQ_TEST_PROJECT"
      - "GCS_TEST_BUCKET"

  # =========================================================================
  # ETAPA 4: Validación de SQL (esquemas BigQuery)
  # =========================================================================
  - name: "google/cloud-sdk:slim"
    id: "validate-sql"
    waitFor: ["lint"]
    entrypoint: bash
    args:
      - -c
      - |
        echo "→ Validando DDL de BigQuery con dry-run..."
        for sql_file in sql/ddl/*.sql; do
          echo "  Validando: $sql_file"
          bq query \
            --project_id="${PROJECT_ID}" \
            --dry_run \
            --use_legacy_sql=false \
            < "$sql_file"
        done
        echo "✓ Validación SQL completada."

  # =========================================================================
  # ETAPA 5: Build y push de imagen Docker
  # =========================================================================
  - name: "gcr.io/cloud-builders/docker"
    id: "build-image"
    waitFor: ["unit-tests", "validate-sql"]
    args:
      - build
      - --tag=gcr.io/$PROJECT_ID/pipeline-ingesta:$COMMIT_SHA
      - --tag=gcr.io/$PROJECT_ID/pipeline-ingesta:$BRANCH_NAME
      - --cache-from=gcr.io/$PROJECT_ID/pipeline-ingesta:$BRANCH_NAME
      - --build-arg=COMMIT_SHA=$COMMIT_SHA
      - --build-arg=BUILD_DATE=$BUILD_DATE
      - .

  - name: "gcr.io/cloud-builders/docker"
    id: "push-image"
    waitFor: ["build-image"]
    args:
      - push
      - gcr.io/$PROJECT_ID/pipeline-ingesta:$COMMIT_SHA

  # =========================================================================
  # ETAPA 6: Deploy a DEV (rama develop)
  # =========================================================================
  - name: "google/cloud-sdk:slim"
    id: "deploy-dev"
    waitFor: ["integration-tests", "push-image"]
    entrypoint: bash
    args:
      - -c
      - |
        if [[ "${BRANCH_NAME}" != "develop" && "${BRANCH_NAME}" != feature/* ]]; then
          echo "→ No es rama de desarrollo. Saltando deploy a Dev."
          exit 0
        fi
        echo "→ Desplegando a Cloud Run DEV..."
        gcloud run deploy pipeline-ingesta-dev \
          --image=gcr.io/${PROJECT_ID}/pipeline-ingesta:${COMMIT_SHA} \
          --region=us-central1 \
          --service-account=sa-pipeline-ingesta-dev@${PROJECT_ID}.iam.gserviceaccount.com \
          --set-env-vars="ENV=dev,GCP_PROJECT_ID=${PROJECT_ID}-dev" \
          --set-secrets="API_KEY=api-key-transactions:latest" \
          --max-instances=5 \
          --no-traffic \
          --tag=commit-${SHORT_SHA}
        echo "✓ Deploy a Dev completado: revision commit-${SHORT_SHA}"

  # =========================================================================
  # ETAPA 7: Deploy a STAGING (rama release/*)
  # =========================================================================
  - name: "google/cloud-sdk:slim"
    id: "deploy-staging"
    waitFor: ["integration-tests", "push-image"]
    entrypoint: bash
    args:
      - -c
      - |
        if [[ "${BRANCH_NAME}" != release/* ]]; then
          echo "→ No es rama release. Saltando deploy a Staging."
          exit 0
        fi
        echo "→ Ejecutando migraciones SQL en Staging..."
        bash scripts/run_migrations.sh staging
        echo "→ Desplegando a Cloud Run STAGING..."
        gcloud run deploy pipeline-ingesta-staging \
          --image=gcr.io/${PROJECT_ID}/pipeline-ingesta:${COMMIT_SHA} \
          --region=us-central1 \
          --service-account=sa-pipeline-ingesta-stg@${PROJECT_ID}.iam.gserviceaccount.com \
          --set-env-vars="ENV=staging,GCP_PROJECT_ID=${PROJECT_ID}-staging" \
          --set-secrets="API_KEY=api-key-transactions:latest" \
          --max-instances=10 \
          --traffic=100
        echo "✓ Deploy a Staging completado."

  # =========================================================================
  # ETAPA 8: Deploy a PRODUCCIÓN (rama main, requiere aprobación manual)
  # =========================================================================
  - name: "google/cloud-sdk:slim"
    id: "deploy-prod"
    waitFor: ["deploy-staging"]
    entrypoint: bash
    args:
      - -c
      - |
        if [[ "${BRANCH_NAME}" != "main" ]]; then
          echo "→ No es rama main. Saltando deploy a Prod."
          exit 0
        fi
        echo "→ Ejecutando migraciones SQL en Producción..."
        bash scripts/run_migrations.sh prod

        echo "→ Desplegando a Cloud Run PRODUCCIÓN (canary 10%)..."
        gcloud run deploy pipeline-ingesta-prod \
          --image=gcr.io/${PROJECT_ID}/pipeline-ingesta:${COMMIT_SHA} \
          --region=us-central1 \
          --service-account=sa-pipeline-ingesta@${PROJECT_ID}.iam.gserviceaccount.com \
          --set-env-vars="ENV=prod,GCP_PROJECT_ID=${PROJECT_ID}" \
          --set-secrets="API_KEY=api-key-transactions:latest" \
          --max-instances=50 \
          --no-traffic \
          --tag=canary

        # Enviar 10% del tráfico a la nueva versión (canary deployment)
        gcloud run services update-traffic pipeline-ingesta-prod \
          --to-tags=canary=10 \
          --region=us-central1

        echo "✓ Canary deploy a Producción completado (10% tráfico)."
        echo "  Monitorear por 30 min antes de promover al 100%."

# =========================================================================
# Configuración global del pipeline
# =========================================================================
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
  substitutionOption: "ALLOW_LOOSE"

substitutions:
  _REGION: "us-central1"
  _DEPLOY_ENV: "dev"

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/bq-test-project/versions/latest
      env: "BQ_TEST_PROJECT"
    - versionName: projects/$PROJECT_ID/secrets/gcs-test-bucket/versions/latest
      env: "GCS_TEST_BUCKET"

# Guardar artefactos del build (resultados de tests, imagen)
artifacts:
  objects:
    location: gs://tg-corp-build-artifacts/$BUILD_ID/
    paths:
      - /workspace/test-results/**
